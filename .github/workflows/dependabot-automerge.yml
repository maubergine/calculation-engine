# Approves Dependabot's minor and patch updates and turns on auto-merge. The ruleset still holds the merge until the
# required checks (test, commitlint) pass. Major updates, and everyone else's PRs, wait for a review.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR"
          gh pr merge --auto --squash "$PR"
